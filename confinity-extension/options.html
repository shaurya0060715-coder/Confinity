<!doctype html>
<html>
<head><meta charset="utf-8"><title>Confinity Options</title></head>
<body>
  <h2>Confinity Extension Settings</h2>
  <label>AI API Key: <input id="aiKey" placeholder="put API key here"></label>
  <button id="save">Save</button>
  <script>
    const aiKey = document.getElementById('aiKey');
    document.getElementById('save').addEventListener('click', ()=>{
      chrome.storage.local.set({aiApiKey: aiKey.value}, ()=>alert('Saved'));
    });
    chrome.storage.local.get(['aiApiKey'], (r)=>{ if (r.aiApiKey) aiKey.value = r.aiApiKey });
  </script>
  <hr>
  <p><a href="rule_manager.html" target="_blank">Manage rule packs (download & apply)</a></p>
</body>
</html>
