<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Confinity Companion</title>
  <style>
    :root {
      --bg: #0f131a;
      --card-bg: #161c26;
      --text: #ffffff;
      --text-muted: #a0aec0;
      --accent: #00d2ff;
      --accent-hover: #ffffff;
      --border: #1c2330;
      --danger: #f56565;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      width: 280px;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h3::before {
      content: '⚡';
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .search-row {
      display: flex;
      gap: 6px;
    }
    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    button:hover {
      background: #1f2736;
      border-color: rgba(0, 210, 255, 0.4);
      color: var(--accent);
    }
    .primary-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      font-weight: 600;
      justify-content: center;
    }
    .primary-btn:hover {
      background: var(--accent-hover);
      color: #0b0f19;
    }
    .search-row button {
      width: auto;
      padding: 8px 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
  </style>
</head>
<body>
  <h3>Companion</h3>
  
  <div class="card">
    <label>Search (ConfiSearch)</label>
    <div class="search-row">
      <input id="search" placeholder="Type to search..." autocomplete="off" />
      <button id="go" class="primary-btn">Go</button>
    </div>
  </div>

  <div class="card grid">
    <button id="openTabGroup">
      <span style="font-size: 16px">📑</span> Create Tab Group
    </button>
    <button id="openOptions">
      <span style="font-size: 16px">⚙️</span> Extension Settings
    </button>
    <button id="toggleAdblock" style="border-color: rgba(245, 101, 101, 0.4); color: #f56565;">
      <span style="font-size: 16px">🛡️</span> Shield Active
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
